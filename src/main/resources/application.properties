spring.config.import=optional:file:.env[.properties]

spring.application.name=backend-odonto
annie.api-key=${ANNIE_API_KEY:}
annie.base-url=${ANNIE_BASE_URL:https://api.annie-insights.com/api/v2}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?sslMode=DISABLED&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:25MB}

storage.s3.enabled=${S3_STORAGE_ENABLED:false}
storage.s3.endpoint=${S3_ENDPOINT:}
storage.s3.region=${S3_REGION:us-east-1}
storage.s3.bucket=${S3_BUCKET:}
storage.s3.access-key=${S3_ACCESS_KEY:}
storage.s3.secret-key=${S3_SECRET_KEY:}
storage.s3.path-style-access=${S3_PATH_STYLE_ACCESS:false}
storage.s3.presigned-url-ttl-seconds=${S3_PRESIGNED_URL_TTL_SECONDS:900}
storage.s3.max-object-size-bytes=${S3_MAX_OBJECT_SIZE_BYTES:26214400}
