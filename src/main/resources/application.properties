spring.application.name=backend-odonto
spring.datasource.url=jdbc:h2:mem:odontodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# Spring AI OpenAI / Mock Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:mock-key-for-local-dev}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
app.chatbot.knowledge-directory=${CHATBOT_KNOWLEDGE_DIRECTORY:./data/knowledge}
app.chatbot.knowledge-version=${CHATBOT_KNOWLEDGE_VERSION:1}
app.chatbot.minimum-similarity=${CHATBOT_MINIMUM_SIMILARITY:0.65}

# Authentication is disabled until an operator configures a 32+ byte signing key and credentials.
app.auth.jwt-secret=${AUTH_JWT_SECRET:}
app.auth.admin.username=${AUTH_ADMIN_USERNAME:}
app.auth.admin.password=${AUTH_ADMIN_PASSWORD:}
app.auth.patient.username=${AUTH_PATIENT_USERNAME:}
app.auth.patient.password=${AUTH_PATIENT_PASSWORD:}
app.auth.odontologo.username=${AUTH_ODONTOLOGO_USERNAME:}
app.auth.odontologo.password=${AUTH_ODONTOLOGO_PASSWORD:}
app.auth.recepcionista.username=${AUTH_RECEPCIONISTA_USERNAME:}
app.auth.recepcionista.password=${AUTH_RECEPCIONISTA_PASSWORD:}
